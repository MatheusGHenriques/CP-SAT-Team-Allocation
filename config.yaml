team_sizes:
  OBC: 7
  Payload: 6
  TT&C: 7
  ADCS: 7
  EPS_TC: 7

optimization:
  mode: lexicographic
  stages:
    - preference
    - score_balance
    - veteran_balance
    - penalties

weights:
  preference:
    1: 120
    2: 70
    3: 35
    4: 10
    5: 0

  penalties:
    rank_4: 40
    rank_5: 120

  high_performance_bonus:
    OBC: 1.35
    ADCS: 1.30
    EPS_TC: 1.15

constraints:
  min_veterans_per_team: 1
  max_time_seconds: 30

metrics:
  exclude_veterans_from_avg_score: false

pareto:
  enabled: true
  points: 12
  min_preference_ratio: 0.92
  time_limit_per_point: 10

  fairness_weights:
    score_balance: 1
    veteran_balance: 1
    penalties: 1

monte_carlo:
  enabled: true
  runs: 100
  score_jitter: 6
  preference_jitter: 1
  preference_noise_probability: 0.08
  time_limit_per_run: 6
  seed: 42
